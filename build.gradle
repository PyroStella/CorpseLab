plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 1.20.1 对应 Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// 游戏集成测试独立编译，仅在专用测试启动时加载，不属于正式模组输出
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    // 第一人称布娃娃摄像机需要 Camera.setPosition，爆炸强度需要 Explosion.radius
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            args '--mixin.config', 'corpselab.mixins.json', '--mixin.config', 'corpselab.gecko.mixins.json'
            if (project.hasProperty('corpseRenderTest')) {
                property 'corpselab.renderTest', 'true'
                if (project.hasProperty('renderTestDirectory')) workingDirectory project.file(project.property('renderTestDirectory'))
                if (project.hasProperty('revivalSceneTest')) property 'corpselab.revivalSceneTest', 'true'
                if (project.hasProperty('geckoPhysicsTest')) {
                    property 'corpselab.geckoPhysicsTest', 'true'
                }
                if (project.hasProperty('renderTestWorld')) {
                    args '--quickPlaySingleplayer', project.property('renderTestWorld')
                }
                mods {
                    "${mod_id}" {
                        source sourceSets.gameTest
                    }
                }
            }
            // GeckoLib 带 mixin，开发环境要打开 refmap 重映射，否则 APPLY 阶段直接崩
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            args '--nogui', '--mixin.config', 'corpselab.mixins.json'
        }

        gameTestServer {
            args '--mixin.config', 'corpselab.mixins.json'
            workingDirectory project.file('run-gametest')
            mods {
                "${mod_id}" {
                    source sourceSets.gameTest
                }
            }
            property 'forge.enabledGameTestNamespaces', "${mod_id},forge"
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // GeckoLib 官方 maven，与防御塔 1.20.1 项目一致
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // geo 模型渲染用；物理内核本身不依赖它
    compileOnly fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    compileOnly 'com.eliotlash.mclib:mclib:20'
    // 使用 -PwithoutGeckoLib 验证完全未安装的运行环境
    if (!project.hasProperty('withoutGeckoLib')) {
        runtimeOnly fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
        runtimeOnly 'com.eliotlash.mclib:mclib:20'
    }


    // 1.20.1 自带 JOML，这里只是编译/测试期需要，不会打包
    implementation 'org.joml:joml:1.10.5'

    // 物理内核与 Minecraft 无关，测试可以脱离游戏跑
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 物理内核零 Minecraft 依赖，单元测试跑得很快，改求解器前先跑这个
tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = false
    }
}

// 独立测试世界使用源码中的空结构，不依赖开发者本地已有的世界或模板
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        copy {
            from 'src/gameTest/resources/gameteststructures'
            into 'run-gametest/gameteststructures'
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    // 防止旧编译产物或后续误配置将游戏测试及模板带入发布包
    exclude '**/gametest/**', 'gameteststructures/**'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs': 'corpselab.mixins.json,corpselab.gecko.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

// 构建时核对实际发布包，连同普通单元测试一起检查，避免测试类泄漏
def verifyProductionJar = tasks.register('verifyProductionJar') {
    group = 'verification'
    description = '验证正式 JAR 不包含测试类或 GameTest 模板'
    dependsOn tasks.named('jar'), tasks.named('testClasses'), tasks.named('gameTestClasses')
    doLast {
        def testClasses = [] as Set
        [sourceSets.test, sourceSets.gameTest].each { testSourceSet ->
            testSourceSet.output.classesDirs.asFileTree.visit { entry ->
                if (!entry.directory) testClasses.add(entry.relativePath.pathString)
            }
        }
        def leakedEntries = []
        zipTree(tasks.named('jar', Jar).get().archiveFile.get().asFile).visit { entry ->
            def path = entry.relativePath.pathString
            if (!entry.directory && (testClasses.contains(path)
                    || path.contains('/gametest/') || path.startsWith('gameteststructures/'))) {
                leakedEntries.add(path)
            }
        }
        if (!leakedEntries.empty) {
            throw new GradleException("正式 JAR 包含测试内容: ${leakedEntries.join(', ')}")
        }
    }
}

tasks.named('check').configure {
    dependsOn verifyProductionJar
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
